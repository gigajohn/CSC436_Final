# ==============================================================================
# Production Docker Compose Configuration (Requirements D3, D4, D5)
# Isolated production containers, volumes, and ports.
# ==============================================================================

name: studysync-prod

services:
  backend-prod:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: studysync-prod-backend
    restart: unless-stopped
    networks:
      default:
        aliases:
          - backend
    environment:
      PORT: 4000
      NODE_ENV: production
      ENVIRONMENT: production
      CORS_ORIGIN: https://studysync.lathropprojects.net
    ports:
      - "127.0.0.1:4001:4000"
    volumes:
      - prod-appdata:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend-prod:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: studysync-prod-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      backend-prod:
        condition: service_healthy

volumes:
  prod-appdata:

