# ==============================================================================
# Staging Docker Compose Configuration (Requirements D3, D4, D5)
# Completely separate data volumes, ports, and configuration.
# ==============================================================================

services:
  backend-staging:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: studysync-staging-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: staging
      ENVIRONMENT: staging
      CANARY_FEATURE_FLAG: "true"
      CORS_ORIGIN: https://staging.studysync.lathropprojects.net
    ports:
      - "127.0.0.1:4002:4000"
    volumes:
      - staging-appdata:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend-staging:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: studysync-staging-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      backend-staging:
        condition: service_healthy

volumes:
  staging-appdata:

